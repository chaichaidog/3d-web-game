<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#18212b"><title>霧境前線 · Block Outpost</title><link rel="stylesheet" href="/style.css"></head><body>
<header><span class="brand"><i>▧</i> BLOCK OUTPOST</span><span id="status">霧境前線 ／ 連線教室</span></header>
<main id="lobby"><section class="splash"><canvas id="cover" aria-label="暮色中的前哨站、森林與感染者"></canvas><span class="index">FIELD STATION &nbsp; / &nbsp; 01</span><div class="title"><small>CO-OP SURVIVAL LAB</small><h1>霧境<span>前線</span></h1><p>用積木啟動角色，和隊友一起守住前線。</p></div></section>
<section class="entry"><div class="tag"><b></b> OUTPOST ACCESS</div><h2 id="entryTitle">加入小隊</h2><form id="join"><label>遊戲暱稱<input id="name" maxlength="16" required placeholder="隊友要怎麼稱呼你？" autocomplete="off"></label><label>房間號碼<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="老師提供的 6 位數字" autocomplete="off"></label><button class="primary">進入基地　→</button></form>
<form id="create" hidden><label>老師開房密碼<input type="password" id="key" required autocomplete="current-password"></label><button class="primary">建立教室　→</button></form><p class="error" id="entryError" role="alert"></p><button class="link" id="role">老師開房 ↗</button></section></main>
<main id="game" hidden><section id="guide" aria-label="新手練習"><div><small id="guideStep">新手練習</small><h2 id="guideTitle">走出第一步</h2><p id="guideText"></p></div><div class="guide-actions"><button id="guideAction" class="primary">打開積木</button><button id="skipGuide" class="link">收起教學</button></div></section><button id="resumeGuide" hidden>查看新手教學</button><div class="gameview"><canvas id="world" tabindex="0" aria-label="學生第一人稱遊戲畫面"></canvas><div id="hud"></div><div id="reticle">＋</div><div id="task"></div></div>
<nav><button id="editBtn">Tab　積木</button><button id="shopBtn">商店</button><button id="backBtn">返回基地</button><button id="helpBtn">舉手求助</button></nav><p class="hint">點遊戲畫面用滑鼠轉向，Esc 釋放滑鼠。也可用 ← → 轉向。亮色地圈內可編輯，走出光圈即可試射。</p></main>
<main id="feedbackPage" hidden><section class="feedback-card" aria-labelledby="feedbackTitle">
<h1 id="feedbackTitle">課堂回饋</h1><p id="feedbackResult"></p><p class="hint">用自己的話寫就好。老師會看到你的回答。</p>
<form id="feedbackForm"><label>這次你學到了什麼，或在哪一步卡住？<textarea id="feedbackLearning" required rows="4" placeholder="例如：我把 W 接到向前移動，後來才發現要按執行。"></textarea></label>
<label>下次你希望改進什麼？（選填）<textarea id="feedbackSuggestion" rows="3" placeholder="例如：希望怪物的提示可以大一點。"></textarea></label>
<button class="primary" id="submitFeedback">送出回饋</button><p id="feedbackStatus" role="status"></p></form></section></main>
<main id="teacher" hidden><small>MISSION CONTROL</small><h1>教室指揮台</h1><div id="roomTitle"></div>
<form id="waveSetup" class="wave-setup" aria-label="波次設定">
<label><input id="autoWaves" type="checkbox" checked> 自動開始下一波</label>
<label>波次上限 <input id="waveLimit" type="number" min="1" step="1" required></label>
<button id="waveSave" type="submit">套用波次設定</button><span id="waveSetupNote" class="hint"></span></form>
<div class="tools"><select id="mode"><option value="survival">自由生存</option><option value="defense">據點防守</option></select><button id="modeBtn">切換模式</button><button class="primary" id="waveBtn">開始第一波</button><button id="pauseBtn">暫停</button><button id="recallBtn">全員回城</button><button id="finishBtn">結束並收回饋</button></div>
<p id="round"></p><section id="teacherFeedback" hidden aria-labelledby="feedbackHeading"><h2 id="feedbackHeading">學生課堂回饋</h2><p id="feedbackCount"></p><div id="feedbackList"></div></section><section id="cards"></section></main>
<dialog id="finishDialog" aria-labelledby="finishHeading"><div class="modalhead"><h2 id="finishHeading">結束本次挑戰？</h2></div><p>學生會離開戰場並開始填寫課堂回饋。</p><form method="dialog" class="tools"><button autofocus>繼續挑戰</button><button type="button" class="primary" id="finishConfirm">確認結束</button></form></dialog>
<dialog id="panel"><div class="modalhead"><div><small>FIELD WORKBENCH</small><h2 id="panelTitle"></h2></div><button id="closePanel" aria-label="關閉">✕</button></div><div id="panelBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
